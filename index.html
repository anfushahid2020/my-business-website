<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=1" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo.png?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png?v=4" />
    <link rel="icon" type="image/png" sizes="64x64" href="/logo.png?v=4" />
    <link rel="icon" type="image/png" sizes="128x128" href="/logo.png?v=4" />
    <link rel="icon" type="image/png" sizes="256x256" href="/logo.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png?v=4" />
    <link rel="shortcut icon" href="/logo.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebDemics</title>
    <!-- Inter font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      /* Immediate desktop layout override to avoid stuck mobile layout */
      html,body { background: #FFFFFF !important; color: #333333 !important; }
      .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
      img { max-width: 100%; height: auto; display: block; }
      @media (min-width: 1024px) { .container { padding: 3rem; } }
      /* Ensure logo image isn't rendered oversized or positioned absolutely */
      img[src*="/logo.png"] {
        width: 40px !important;
        height: 40px !important;
        max-width: 40px !important;
        position: relative !important;
        top: auto !important;
        left: auto !important;
        margin: 0 !important;
        transform: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
